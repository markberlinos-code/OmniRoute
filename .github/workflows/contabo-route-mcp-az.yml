# =============================================================================
# route.mcp.az (vo-edge, Contabo) — build & push to our own GHCR
# Qayda: rules/contabo-deploy-modes.md (PROD: serverdə build QADAĞAN)
#
# Bu, upstream-in öz .github/workflows/docker-publish.yml-inə TOXUNMUR (o fayl
# diegosouzapw/omniroute-a push etməyə çalışır, bizim fork-da uğursuz olardı).
# Bu ayrıca workflow yalnız bizim prod branch-imizdə işə düşür və
# ghcr.io/<bizim-fork>/omniroute-a push edir.
# =============================================================================

name: route-mcp-az-build-and-push

on:
  push:
    branches: [prod/route-mcp-az]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=prod-latest
            type=sha,prefix=prod-,format=short

      - name: Build & push (runner-base target)
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner-base
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            OMNIROUTE_USE_TURBOPACK=0
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan (advisory)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.push.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Summary
        run: |
          echo "Image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "Digest: ${{ steps.push.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo "Tags: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
